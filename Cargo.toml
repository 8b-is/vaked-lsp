[package]
name = "vaked-lsp"
version = "0.1.0"
edition = "2024"
description = "the all-in-one LSP gateway — one endpoint for UE C++, Rust, Go, Luau, and Bash"
license = "Apache-2.0"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-nats = "0.49"
futures = "0.3.34"


[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
